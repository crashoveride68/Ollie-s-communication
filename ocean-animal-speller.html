.overlay{position:absolute;inset:0;background:linear-gradient(180deg,#ffffff12,#003b5f18 70%,#003b5f55);pointer-events:none}
.sand{position:absolute;bottom:0;left:-5%;width:110%;height:48px;background:#ead38acc;border-radius:50% 50% 0 0}
.fish{position:absolute;font-size:50px;z-index:3;filter:drop-shadow(0 3px 2px #003b5f66);animation:swim 10s linear infinite alternate}
.fish span{display:block;animation:bob 2s ease-in-out infinite}
.fish:nth-child(even){animation-duration:13s;animation-direction:alternate-reverse}
.bubble{position:absolute;border:2px solid #ffffffaa;border-radius:50%;animation:rise 7s linear infinite;z-index:2}
.b1{width:14px;height:14px;left:15%;bottom:20px}.b2{width:9px;height:9px;left:52%;bottom:30px;animation-delay:2s}.b3{width:18px;height:18px;right:14%;bottom:10px;animation-delay:1s}
@keyframes swim{from{transform:translateX(-20px)}to{transform:translateX(430px)}}@keyframes bob{50%{transform:translateY(-9px)}}@keyframes rise{to{transform:translateY(-330px);opacity:0}}
.collection{display:grid;grid-template-columns:repeat(auto-fit,minmax(78px,1fr));gap:8px;margin-top:12px}.col{background:#003b5f77;border-radius:14px;padding:7px;text-align:center;font-size:12px;font-weight:800;border:1px solid #ffffff30}.col span{font-size:30px}.locked{opacity:.3;filter:grayscale(1)}
.game{text-align:center}.animal{font-size:105px;line-height:1;margin:5px}.word{font-size:clamp(30px,6vw,48px);font-weight:1000;letter-spacing:3px}.hear{padding:12px 22px;background:#d9f7ff;color:#075477;font-size:18px}.slots{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin:14px}.slot{width:44px;height:52px;background:white;color:#075477;border-radius:10px;display:grid;place-items:center;font-size:27px;font-weight:1000;transition:.15s}.slot.correct{background:#72e59a;color:#075477;transform:scale(1.04)}.key.used{opacity:0;transform:scale(.65);pointer-events:none}.key.wrong{background:#f46b6b!important;border-color:#ffb0b0!important;animation:shake .22s linear}@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}.keys{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:8px;max-width:850px;margin:auto}.keys .key{width:58px;flex:0 0 58px}.key{min-height:52px;background:#087db0;color:white;border:2px solid #70d5f3;font-size:22px}.key:active{transform:scale(.95)}.feedback{min-height:30px;font-size:19px;font-weight:900;margin:10px}.back{padding:10px 18px;background:white;color:#075477;margin-top:12px}
.voice{margin-top:12px;font-size:14px}.voice select{border-radius:10px;padding:8px;max-width:100%}
.celebrate{position:fixed;inset:0;background:#003c5fcc;display:none;align-items:center;justify-content:center;z-index:10}.celebrate.show{display:flex}.box{background:white;color:#075477;border-radius:28px;padding:30px;text-align:center;margin:20px;box-shadow:0 15px 50px #001d2e88}.big{font-size:70px}.box button{padding:14px 24px;border:0;border-radius:15px;background:#ffd34d;color:#075477;font-weight:1000}
.complete{font-size:22px;font-weight:1000;margin:12px}
@media(max-width:600px){.keys{justify-content:center}.keys .key{width:52px;flex-basis:52px}.key{font-size:18px}.aquarium{height:285px}.fish{font-size:42px}}

.game-scene.active{display:flex;align-items:center;justify-content:center}
.game-overlay{width:min(850px,96%);padding:22px 24px 18px;border:2px solid #ffffff88;border-radius:28px;background:rgba(5,91,140,.64);box-shadow:0 12px 40px #003b5f66;backdrop-filter:blur(4px);text-align:center}
.game-overlay .stats{margin-bottom:8px}
.game-overlay .animal{font-size:100px;line-height:1;margin:0 0 4px}
.game-overlay .slots{margin:16px auto 14px}
.game-overlay .keys{max-width:700px}
.game-actions{display:flex;justify-content:center;gap:12px;margin-top:12px}
.erase{border:0;border-radius:16px;padding:12px 25px;font-weight:1000;font-size:18px;cursor:pointer}
.erase{background:#dce8f2;color:#36556b}
.erase:active{transform:translateY(2px)}

<body>
<div class="wrap">
<header><h1>🐠 Ollie's Ocean Aquarium 🐠</h1><div class="sub">Spell the animals and build your very own aquarium!</div></header>

<section id="home" class="screen active panel" style="text-align:center">
<div class="stats"><div class="stat">⭐ <span id="stars">0</span> stars</div><div class="stat">🐠 <span id="count">0</span> / 19 collected</div></div>
<div class="aquarium" id="tank"></div>
<h2>My Aquarium</h2><p>Every animal you spell correctly swims into your aquarium!</p>
<button class="play" id="play">▶ PLAY</button><button class="back" id="collectionReset" type="button" style="margin-left:8px;background:#ff6262;color:#fff">↻ Reset Collection</button>
<div class="collection" id="collection"></div>
</section>

<section id="game" class="screen game-scene">
<div class="game-overlay">
  <div class="stats"><div class="stat">⭐ <span id="gstars">0</span></div><div class="stat">🐠 <span id="gcount">0</span> / 19</div></div>
  <div class="animal" id="emoji" aria-live="polite"></div>
  <button class="hear" id="hear">🔊 Hear Word</button>
  <div class="slots" id="slots"></div>
  <div class="keys" id="keys"></div>
  <div class="feedback" id="feedback"></div>
  <div class="game-actions">
    <button class="erase" id="erase" type="button">⌫</button>
    
  </div>
  <button class="back" id="back" type="button">🏠 Aquarium</button>
  <div class="voice">Voice: <select id="voice"></select> <button class="hear" id="test" style="padding:7px 12px">Test</button></div>
</div>
</section>
</div>

<div class="celebrate" id="celebrate"><div class="box"><div class="big">🌟🐠🎉</div><h2>Well done!</h2><p id="msg"></p><button id="next">Next Animal</button></div></div>

<script>
const animals=[["FISH", "🐟"], ["SEAL", "🦭"], ["CRAB", "🦀"], ["SHARK", "🦈"], ["WHALE", "🐋"], ["SQUID", "🦑"], ["CLOWNFISH", "🐠"], ["BLUE TANG", "🐟"], ["TURTLE", "🐢"], ["DOLPHIN", "🐬"], ["OCTOPUS", "🐙"], ["STARFISH", "⭐"], ["SEAHORSE", "🐚"], ["MANTA RAY", "🪽"], ["JELLYFISH", "🪼"], ["SEALION", "🦭"], ["STINGRAY", "🪽"], ["HAMMERHEAD", "🦈"], ["SWORDFISH", "🐟"]];
let collected=JSON.parse(localStorage.getItem("oceanCollected")||"[]"), stars=+localStorage.getItem("oceanStars")||0, current=-1, typed="";
const $=x=>document.getElementById(x);

function save(){localStorage.setItem("oceanCollected",JSON.stringify(collected));localStorage.setItem("oceanStars",stars);render();}
function render(){
 $("stars").textContent=stars;$("count").textContent=collected.length;$("gstars").textContent=stars;$("gcount").textContent=collected.length;
 const t=$("tank");t.innerHTML='<div class="overlay"></div><div class="sand"></div><div class="bubble b1"></div><div class="bubble b2"></div><div class="bubble b3"></div>';
 collected.forEach((i,n)=>{
   const f=document.createElement("div");f.className="fish";f.style.top=(25+(n*47)%235)+"px";f.style.left=((n*17)%68)+"%";
   f.style.animationDelay=(-n*0.8)+"s";f.innerHTML="<span>"+animals[i][1]+"</span>";t.appendChild(f);
 });
 const c=$("collection");c.innerHTML="";
 animals.forEach((a,i)=>{const d=document.createElement("div");d.className="col"+(collected.includes(i)?"":" locked");d.innerHTML="<span>"+a[1]+"</span><br>"+(collected.includes(i)?a[0]:"???");c.appendChild(d);});
}
function show(id){document.querySelectorAll(".screen").forEach(x=>x.classList.remove("active"));$(id).classList.add("active");}
function speak(text){
 if(!("speechSynthesis" in window))return;
 speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text),v=speechSynthesis.getVoices(),saved=localStorage.getItem("oceanVoiceName");
 const q=v.find(x=>x.name===saved)||v.find(x=>/^en[-_]AU/i.test(x.lang))||v.find(x=>/^en[-_]GB/i.test(x.lang))||v.find(x=>/^en[-_]US/i.test(x.lang));
 if(q){u.voice=q;u.lang=q.lang}else u.lang="en-AU";u.rate=.78;u.pitch=1.05;speechSynthesis.speak(u);
}
function voices(){
 const s=$("voice");s.innerHTML="";
 speechSynthesis.getVoices().filter(v=>/^en[-_]/i.test(v.lang)).forEach(v=>{const o=document.createElement("option");o.value=v.name;o.textContent=v.name+" ("+v.lang+")";s.appendChild(o);});
 const saved=localStorage.getItem("oceanVoiceName");if(saved)s.value=saved;
}
function newAnimal(){
 const r=animals.map((_,i)=>i).filter(i=>!collected.includes(i));
 if(!r.length){$("name").textContent="AQUARIUM COMPLETE!";$("emoji").textContent="🏆";$("slots").innerHTML="";$("keys").innerHTML="";return;}
 current=r[Math.floor(Math.random()*r.length)];typed="";$("emoji").textContent=animals[current][1];$("name").textContent="";draw();setTimeout(()=>speak(animals[current][0]),250);
}
function draw(){
 const w=animals[current][0].replace(/ /g,""),s=$("slots");s.innerHTML="";
 for(let i=0;i<w.length;i++){
   const d=document.createElement("div");d.className="slot"+(typed[i]===w[i]?" correct":"");d.textContent=typed[i]||"_";s.appendChild(d);
 }
 const k=$("keys");k.innerHTML="";
 const remaining=[];
 for(let i=typed.length;i<w.length;i++) remaining.push(w[i]);
 remaining.sort(()=>Math.random()-.5).forEach((ch,index)=>{
   const b=document.createElement("button");b.className="key";b.type="button";b.textContent=ch;
   b.dataset.letter=ch;
   b.onclick=()=>press(ch,b);
   k.appendChild(b);
 });
}
function press(ch,button){
 const w=animals[current][0].replace(/ /g,"");
 const pos=typed.length;
 if(pos>=w.length)return;
 if(ch===w[pos]){
   typed+=ch;
   button.classList.add("used");
   draw();
   if(typed.length===w.length) correct();
 }else{
   button.classList.add("wrong");
   $("feedback").textContent="Try the next letter 😊";
   setTimeout(()=>{button.classList.remove("wrong");$("feedback").textContent=""},450);
 }
}
function correct(){
 if(!collected.includes(current)){collected.push(current);stars++;save();}
 $("msg").textContent=animals[current][0]+" is now swimming in your aquarium!";
 $("celebrate").classList.add("show");
 speak("Well done! "+animals[current][0]+" is now in your aquarium.");
}
$("play").onclick=()=>{show("game");newAnimal();};
$("back").onclick=()=>{show("home");render();};
$("hear").onclick=()=>speak(animals[current][0]);

$("erase").onclick=()=>{if(typed.length){typed=typed.slice(0,-1);$("feedback").textContent="";draw();}};
$("test").onclick=()=>speak("Hello! This is your ocean aquarium.");
$("voice").onchange=e=>localStorage.setItem("oceanVoiceName",e.target.value);
$("next").onclick=()=>{$("celebrate").classList.remove("show");show("game");newAnimal();};
if("speechSynthesis" in window)speechSynthesis.onvoiceschanged=voices;
voices();render();
</script>
</body>
</html>
