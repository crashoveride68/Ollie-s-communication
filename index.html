<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ollie's Communication</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#e7f7ff,#fff);font-family:Arial,sans-serif}
.card{width:min(94vw,820px);padding:30px 20px 36px;text-align:center;background:#fff;border-radius:30px;box-shadow:0 10px 30px rgba(0,0,0,.12)}
h1{font-size:clamp(25px,6vw,42px);color:#174b70;margin:0 0 22px}
.mic{width:110px;height:110px;border-radius:55px;border:0;background:#e9f3f8;font-size:50px;cursor:pointer;touch-action:manipulation}
.mic.listening{background:#ffdede;box-shadow:0 0 0 8px #ffecec}
.status{min-height:32px;margin:18px 0;color:#66808f;font-size:20px}
.words{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:22px 0}
.word{border:0;padding:15px 17px;border-radius:16px;background:#eef3f6;color:#6a7880;font-size:clamp(25px,5.5vw,43px);font-weight:700;cursor:pointer;touch-action:manipulation}
.word.active{background:#cceeff;color:#174b70;outline:4px solid #75c9ee}
.word.recognised{background:#dff5df;color:#236b2b;cursor:default}
.word:disabled{opacity:1}
.reset{margin-top:18px;border:0;border-radius:14px;padding:12px 20px;font-size:18px;background:#eee;color:#444}
</style>
</head>
<body>
<main class="card">
<h1>Can Ollie have a shower please Daddy?</h1>

<div id="status" class="status">Press Start to begin.</div>

<div class="words" aria-label="Words to practise">
<button class="word" type="button" data-word="can">Can</button>
<button class="word" type="button" data-word="ollie">Ollie</button>
<button class="word" type="button" data-word="have">have</button>
<button class="word" type="button" data-word="a">a</button>
<button class="word" type="button" data-word="shower">shower</button>
<button class="word" type="button" data-word="please">please</button>
<button class="word" type="button" data-word="daddy">Daddy</button>
</div>

<button id="reset" class="reset" type="button">Reset</button>
</main>

<script>
(function(){
const status=document.getElementById("status");
const reset=document.getElementById("reset");
const buttons=[...document.querySelectorAll(".word")];
const Recognition=window.SpeechRecognition||window.webkitSpeechRecognition;

let recognition=null;
let selected=null;
let listening=false;
let started=false;
let completed=false;

function stopListening(){
  if(recognition && listening){
    listening=false;
    try{recognition.stop();}catch(e){}
  }
}

function distance(a,b){
  const dp=Array.from({length:a.length+1},(_,i)=>Array(b.length+1).fill(0));
  for(let i=0;i<=a.length;i++) dp[i][0]=i;
  for(let j=0;j<=b.length;j++) dp[0][j]=j;
  for(let i=1;i<=a.length;i++){
    for(let j=1;j<=b.length;j++){
      dp[i][j]=Math.min(dp[i-1][j]+1,dp[i][j-1]+1,
        dp[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
    }
  }
  return dp[a.length][b.length];
}

function closeEnough(heard,target){
  const spoken=heard.toLowerCase().replace(/[^a-z0-9\s]/g," ");
  const words=spoken.split(/\s+/).filter(Boolean);
  return words.some(word=>{
    if(word===target) return true;
    if(word.includes(target) || target.includes(word)) return true;
    const maxErrors=target.length<=2 ? 0 : target.length<=4 ? 1 : 2;
    return distance(word,target)<=maxErrors;
  });
}

function announceCurrentWord(){
  if(!selected || completed) return;

  buttons.forEach(b=>b.classList.remove("active"));
  selected.classList.add("active");

  if("speechSynthesis" in window){
    speechSynthesis.cancel();
    const voice=new SpeechSynthesisUtterance(selected.dataset.word);
    voice.lang="en-AU";
    voice.rate=0.8;
    const voices=speechSynthesis.getVoices();
    const au=voices.find(v=>v.lang && v.lang.toLowerCase().startsWith("en-au"));
    if(au) voice.voice=au;
    speechSynthesis.speak(voice);
  }

  status.textContent="Listening...";
  setTimeout(startRecognition,700);
}

function startRecognition(){
  if(!selected || selected.disabled || !Recognition || completed) return;

  if(recognition && listening) stopListening();

  recognition=new Recognition();
  recognition.lang="en-AU";
  recognition.continuous=false;
  recognition.interimResults=true;
  recognition.maxAlternatives=3;

  recognition.onstart=()=>{
    listening=true;
    status.textContent="Listening...";
  };

  recognition.onresult=(event)=>{
    let heard="";
    for(let i=0;i<event.results.length;i++){
      for(let j=0;j<event.results[i].length;j++){
        heard+=" "+event.results[i][j].transcript;
      }
    }

    if(closeEnough(heard,selected.dataset.word.toLowerCase())){
      const finished=selected;
      stopListening();
      finished.disabled=true;
      finished.classList.remove("active");
      finished.classList.add("recognised");
      finished.textContent="✓ "+finished.textContent.trim();

      const next=buttons.find(b=>!b.disabled);
      if(next){
        selected=next;
        setTimeout(announceCurrentWord,350);
      }else{
        completed=true;
        status.textContent="All words recognised! 🎉";
      }
    }
  };

  recognition.onerror=(event)=>{
    listening=false;
    if(event.error==="not-allowed"||event.error==="service-not-allowed"){
      status.textContent="Microphone access was blocked. Allow microphone access for this website.";
    }else{
      status.textContent="Listening...";
      setTimeout(startRecognition,500);
    }
  };

  recognition.onend=()=>{
    listening=false;
    if(selected && !selected.disabled && !completed){
      setTimeout(startRecognition,350);
    }
  };

  try{recognition.start();}
  catch(e){setTimeout(startRecognition,500);}
}

function begin(){
  if(started || !Recognition) return;
  started=true;
  selected=buttons.find(b=>!b.disabled) || null;
  announceCurrentWord();
}

if(!Recognition){
  status.textContent="Live speech recognition isn't supported by this browser. Try Chrome on the Lenovo tablet.";
}else{
  status.textContent="Starting...";
  setTimeout(begin,1000);
}

reset.addEventListener("click",()=>{
  stopListening();
  if("speechSynthesis" in window) speechSynthesis.cancel();
  selected=null;
  started=false;
  completed=false;
  buttons.forEach(button=>{
    button.disabled=false;
    button.classList.remove("active","recognised");
    button.textContent=button.dataset.word.charAt(0).toUpperCase()+button.dataset.word.slice(1);
  });
  status.textContent="Starting...";
  if(Recognition) setTimeout(begin,1000);
});
})();
</script>
</body>
</html>
